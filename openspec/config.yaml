schema: spec-driven

context: |
  Tech stack: Godot 4, GDScript
  Game type: Tetris roguelite (attack-based scoring, run structure, shop, techniques/keystones/augments)
  Automated testing: GUT (Godot Unit Test) — test files in game/tests/unit/test_*.gd, extend GutTest
  Autoloads: RunState (run lifecycle, PRNG), Economy (coins/interest), Settings
  Key classes: TetrisBoard, BagRandomizer, RoundConfig, RunManager, RunSave

rules:
  tasks:
    - Always include a "Testing" section at the end with unit test tasks for any pure functions,
      deterministic logic, or calculations introduced by the change. Each test task should name
      the specific scenario to cover (e.g. "add test for X returns Y when Z"). Omit this section
      only if the change is purely visual/scene-layout with no testable logic.
